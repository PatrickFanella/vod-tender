name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:
    gitleaks:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_SUMMARY: true
              # Fails on any secret findings. Use .gitleaks.toml for baseline suppressions.

    govulncheck:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.24.x'
                  cache: true

            - name: Install govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@latest

            - name: Run govulncheck
              working-directory: backend
              run: govulncheck ./...
              # Fails on any known vulnerabilities affecting this code. Go vuln DB is curated for exploitable vulns.

    build-test-lint:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install system deps
              run: echo 'No native dependencies required (pure Go with pgx)'

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.24.x'
                  cache: true
                  cache-dependency-path: backend/go.sum

            - name: Go env
              run: |
                  go version
                  go env

            - name: Build
              run: make build-backend

            - name: Test with coverage
              working-directory: backend
              run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: ./backend/coverage.out
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Check coverage threshold
              working-directory: backend
              run: |
                  COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
                  echo "Total coverage: ${COVERAGE}%"

                  # Note: Coverage threshold is currently relaxed to 50% to allow gradual improvement
                  # Target is 70% as per project standards
                  THRESHOLD=50

                  if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
                      echo "❌ Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
                      echo "Target coverage is 70%, current threshold is ${THRESHOLD}%"
                      exit 1
                  else
                      echo "✅ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
                  fi

            - name: Retain full-suite coverage report
              working-directory: backend
              run: go tool cover -func=coverage.out | tee coverage.txt

            - name: Upload backend coverage report
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              with:
                  name: coverage-report
                  path: |
                      backend/coverage.out
                      backend/coverage.txt
                  retention-days: 30

            - name: Vet
              working-directory: backend
              run: go vet ./...

            - name: Install golangci-lint
              run: |
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin

            - name: Lint
              run: make lint-backend

    frontend:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: |
                      frontend/package-lock.json
                      frontend/package.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: TypeScript type checking
              working-directory: frontend
              run: npx tsc --noEmit

            - name: Lint
              run: make lint-frontend

            - name: Unit tests
              run: make test-frontend

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  files: ./frontend/coverage/lcov.info
                  flags: frontend
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

            - name: Upload coverage artifacts
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  retention-days: 30

            - name: Build
              run: make build-frontend

            - name: Track bundle size
              working-directory: frontend
              run: |
                  if [ -d dist ]; then
                    echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    du -sh dist >> $GITHUB_STEP_SUMMARY
                    find dist -type f \( -name "*.js" -o -name "*.css" \) -print0 | xargs -0 ls -lh >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  fi

    frontend-e2e:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        needs: [frontend]
        env:
            PG_CONTAINER: vod-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: |
                      frontend/package-lock.json
                      frontend/package.json

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.24.x'
                  cache: true
                  cache-dependency-path: backend/go.sum

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Install Playwright browsers
              working-directory: frontend
              run: npx playwright install --with-deps chromium

            - name: Start a job-owned disposable database
              run: bash scripts/ci-postgres.sh start

            - name: Build backend
              working-directory: backend
              run: go build -o vod-tender .

            - name: Start backend server
              working-directory: backend
              env:
                  HTTP_ADDR: ':8080'
                  LOG_LEVEL: info
              run: |
                  ./vod-tender &
                  echo $! > backend.pid
                  sleep 5

            - name: Wait for backend to be ready
              run: |
                  timeout 30 bash -c 'until curl -f http://localhost:8080/healthz; do sleep 1; done'

            - name: Run E2E tests
              working-directory: frontend
              env:
                  PLAYWRIGHT_BASE_URL: http://localhost:3000
                  VITE_API_BASE_URL: http://localhost:8080
              run: npx playwright test --project=chromium

            - name: Upload Playwright report
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: playwright-report
                  path: frontend/playwright-report/
                  retention-days: 30

            - name: Upload Playwright test results
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: playwright-test-results
                  path: frontend/test-results/
                  retention-days: 30

            - name: Stop backend server
              if: always()
              run: |
                  if [ -f backend/backend.pid ]; then
                    kill $(cat backend/backend.pid) || true
                  fi

            - name: Remove the job-owned disposable database
              if: always()
              run: bash scripts/ci-postgres.sh stop

    docker-images:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        needs: [build-test-lint, frontend, frontend-e2e]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build backend Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  platforms: linux/amd64
                  push: false
                  tags: vod-tender-backend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  load: true

            - name: Build frontend Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  platforms: linux/amd64
                  push: false
                  tags: vod-tender-frontend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  load: true

            - name: Run Trivy vulnerability scanner on backend
              uses: aquasecurity/trivy-action@0.33.1
              with:
                  image-ref: 'vod-tender-backend:${{ github.sha }}'
                  format: 'sarif'
                  output: 'trivy-backend-results.sarif'
                  severity: 'CRITICAL,HIGH'
                  exit-code: '1'

            - name: Upload backend Trivy results to GitHub Security
              uses: github/codeql-action/upload-sarif@v4
              if: always() && github.server_url == 'https://github.com'
              with:
                  sarif_file: 'trivy-backend-results.sarif'
                  category: 'trivy-backend'

            - name: Run Trivy vulnerability scanner on backend (JSON report)
              uses: aquasecurity/trivy-action@0.33.1
              if: always()
              with:
                  image-ref: 'vod-tender-backend:${{ github.sha }}'
                  format: 'json'
                  output: 'trivy-backend-results.json'
                  severity: 'CRITICAL,HIGH,MEDIUM,LOW'

            - name: Run Trivy vulnerability scanner on frontend
              uses: aquasecurity/trivy-action@0.33.1
              with:
                  image-ref: 'vod-tender-frontend:${{ github.sha }}'
                  format: 'sarif'
                  output: 'trivy-frontend-results.sarif'
                  severity: 'CRITICAL,HIGH'
                  exit-code: '1'

            - name: Upload frontend Trivy results to GitHub Security
              uses: github/codeql-action/upload-sarif@v4
              if: always() && github.server_url == 'https://github.com'
              with:
                  sarif_file: 'trivy-frontend-results.sarif'
                  category: 'trivy-frontend'

            - name: Run Trivy vulnerability scanner on frontend (JSON report)
              uses: aquasecurity/trivy-action@0.33.1
              if: always()
              with:
                  image-ref: 'vod-tender-frontend:${{ github.sha }}'
                  format: 'json'
                  output: 'trivy-frontend-results.json'
                  severity: 'CRITICAL,HIGH,MEDIUM,LOW'

            - name: Upload Trivy scan reports
              uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
              if: always()
              with:
                  name: trivy-reports
                  path: |
                      trivy-backend-results.json
                      trivy-backend-results.sarif
                      trivy-frontend-results.json
                      trivy-frontend-results.sarif
                  retention-days: 30

    multi-arch-builds:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        needs: [build-test-lint, frontend]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build backend multi-arch (verification only)
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  platforms: linux/arm64
                  push: false
                  tags: vod-tender-backend-multiarch:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build frontend multi-arch (verification only)
              uses: docker/build-push-action@v5
              with:
                  context: ./frontend
                  platforms: linux/arm64
                  push: false
                  tags: vod-tender-frontend-multiarch:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    database-migration-tests:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        env:
            PG_CONTAINER: vod-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Start a job-owned disposable database
              run: bash scripts/ci-postgres.sh start

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.24.x'
                  cache: true
                  cache-dependency-path: backend/go.sum

            - name: Run migration tests
              working-directory: backend
              run: go test ./db -v

            - name: Verify schema integrity
              run: |
                  docker exec "$PG_CONTAINER" psql -U vod_test -d vod_test -c "\dt"

            - name: Remove the job-owned disposable database
              if: always()
              run: bash scripts/ci-postgres.sh stop

    integration-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            COMPOSE_PROJECT_NAME: vod-ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
            COMPOSE_FILE: .ci-compose.json
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Generate isolated test infrastructure
              run: |
                  set -euo pipefail
                  printf 'LOG_LEVEL=info\nLOG_FORMAT=text\nHTTP_ADDR=:8080\n' > backend/.env
                  docker compose -f docker-compose.yml config --format json | python3 scripts/ci-compose.py > .ci-compose.json
                  docker compose config --quiet
            - name: Start and health-check the isolated stack
              run: docker compose up -d --build --wait --wait-timeout 180
              timeout-minutes: 15
            - name: Exercise API and frontend from their private network
              run: |
                  set -euo pipefail
                  network="${COMPOSE_PROJECT_NAME}_web"
                  for endpoint in healthz status metrics; do
                    docker run --rm --network "$network" curlimages/curl:8.12.1 -fsS "http://api:8080/$endpoint"
                  done
                  docker run --rm --network "$network" curlimages/curl:8.12.1 -fsS http://frontend/ > /dev/null
            - name: Show owned service logs on failure
              if: failure()
              run: docker compose logs
            - name: Remove only this run's infrastructure
              if: always()
              run: |
                  if [ -s .ci-compose.json ]; then docker compose down --volumes --remove-orphans; fi
