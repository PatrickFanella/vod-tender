version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - errcheck
    - staticcheck
    - unused
    - bodyclose
    - errname
    - errorlint
    - gosec
    - misspell
    - noctx
    - unparam
  settings:
    govet:
      disable:
        - shadow
        - unusedwrite
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - govet
          - staticcheck
        path: _test\.go
      - linters:
          - errcheck
        path: backend/testutil/.*\.go
      - linters:
          - contextcheck
        path: backend/server/server\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
